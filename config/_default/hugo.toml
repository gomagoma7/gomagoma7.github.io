baseURL = "https://jhonda.ochakumi.com/"
defaultContentLanguage = "en"
theme = "congo"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true
