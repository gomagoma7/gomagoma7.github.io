baseURL = "https://jhonda.ochakumi.com/"
defaultContentLanguage = "en"
theme = "congo"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]

[outputFormats]
  [outputFormats.llms]
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

# Keep attribute quotes so verification tags stay byte-identical to what
# third parties (e.g. Impact) expect when they string-match the <head>
[minify.tdewolff.html]
  keepQuotes = true
