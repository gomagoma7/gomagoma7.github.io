# Build and deploy Hugo site to GitHub Pages
# Pulls publishable content from Voyager (private) asterismos/
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  # Allow Voyager to trigger rebuilds when content is published
  repository_dispatch:
    types: [voyager-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull publishable content from Voyager
        env:
          VOYAGER_TOKEN: ${{ secrets.VOYAGER_PAT }}
        run: |
          if [ -z "$VOYAGER_TOKEN" ]; then
            echo "VOYAGER_PAT secret not set, skipping Voyager content pull"
            exit 0
          fi
          git clone --depth 1 https://${VOYAGER_TOKEN}@github.com/gomagoma7/voyager.git /tmp/voyager
          # Copy asterismos/beacon/ contents into content/
          if [ -d /tmp/voyager/asterismos/beacon ]; then
            cp -r /tmp/voyager/asterismos/beacon/* content/
            echo "Published content:"
            find content/ -name "*.md" -newer .git/HEAD | head -20
          else
            echo "asterismos/beacon/ not found in Voyager, skipping"
          fi
          rm -rf /tmp/voyager

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
