<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iEEG Data Analysis with Python</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .slide-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 25px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    button {
      background: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #ddd;
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .counter {
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <img id="current-slide" class="slide" alt="Slide">
  </div>

  <div class="controls">
    <button id="prev-btn">◀ Previous</button>
    <span class="counter" id="counter">1 / 4</span>
    <button id="next-btn">Next ▶</button>
  </div>

  <script>
    let currentSlide = 0;
    const totalSlides = 4;
    const slideImage = document.getElementById('current-slide');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function showSlide(index) {
      currentSlide = index;
      slideImage.src = `2025-01-13-rhythms-brain/slide-${String(index + 1).padStart(2, '0')}.png`;
      counter.textContent = `${index + 1} / ${totalSlides}`;

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === totalSlides - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSlide > 0) showSlide(currentSlide - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentSlide > 0) {
        showSlide(currentSlide - 1);
      } else if (e.key === 'ArrowRight' && currentSlide < totalSlides - 1) {
        showSlide(currentSlide + 1);
      }
    });

    showSlide(0);
  </script>
</body>
</html>
