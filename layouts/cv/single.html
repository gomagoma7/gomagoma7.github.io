{{- define "main" }}
<article class="cv-page">
  <header class="cv-header">
    <h1>{{ .Title }}</h1>
    <p class="cv-name">Junya G. Honda / 本田 純也</p>
    <p class="cv-affiliation">Toyohashi University of Technology — M.S. in Computer Science</p>
  </header>
  <div class="post-content cv-content">
    {{- .Content }}
  </div>
  <div class="cv-print-hint">
    <button onclick="document.title='CV — Junya G. Honda'; window.print(); document.title='CV | Junya G. Honda';">Save as PDF</button>
  </div>
</article>
{{- end }}
