{{/* Override of Congo's home/profile.html — adds the neural-motif host
     (data-neural + .home-hero) around the profile hero. */}}
<article
  data-neural
  class="home-hero {{ if not .Site.Params.homepage.showRecent }}
    h-full
  {{ end }} flex flex-col items-center justify-center text-center"
>
  {{ partial "profile.html" }}
  <section class="prose dark:prose-invert">{{ .Content | emojify }}</section>
</article>
{{ if .Site.Params.homepage.showRecent }}
  <section>
    {{ partial "recent-articles.html" . }}
  </section>
{{ end }}
